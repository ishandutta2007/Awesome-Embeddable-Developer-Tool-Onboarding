<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.18); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 320px;
    }
    .float-1 {
      animation: floatCard1 6s ease-in-out infinite;
    }
    .float-2 {
      animation: floatCard2 7s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashMove 3s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
    }
    .code-font {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace;
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Atmospheric Orbs in Background -->
  <circle class="orb-1" cx="200" cy="90" r="140" fill="#38bdf8" opacity="0.3" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="310" r="160" fill="#c084fc" opacity="0.25" filter="url(#glow)" />
  <circle cx="600" cy="380" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Connection Stream / Wave in Lower Midground -->
  <path class="flow-line" d="M 50,340 C 300,310 450,380 700,330 C 950,280 1080,360 1150,320" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />
  <path class="flow-line" d="M 50,360 C 250,380 500,310 750,360 C 1000,410 1100,300 1150,340" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="2" />

  <!-- Subtle Foreground Accent Border -->
  <rect x="2" y="2" width="1196" height="416" rx="14" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Floating Interactive Component Card: Left Preview -->
  <g class="float-1" transform="translate(60, 240)">
    <rect width="260" height="110" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" filter="url(#cardGlow)" />
    <!-- Window dots -->
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4.5" fill="#eab308" opacity="0.8" />
    <circle cx="48" cy="18" r="4.5" fill="#22c55e" opacity="0.8" />
    <text x="66" y="22" fill="#94a3b8" class="code-font" font-size="11">interactive-sandbox.tsx</text>
    <!-- Code line simulation -->
    <rect x="20" y="38" width="80" height="7" rx="3.5" fill="#38bdf8" opacity="0.7" />
    <rect x="108" y="38" width="110" height="7" rx="3.5" fill="#818cf8" opacity="0.6" />
    <rect x="20" y="54" width="140" height="7" rx="3.5" fill="#94a3b8" opacity="0.5" />
    <rect x="168" y="54" width="50" height="7" rx="3.5" fill="#22c55e" opacity="0.7" />
    <rect x="20" y="70" width="100" height="7" rx="3.5" fill="#c084fc" opacity="0.6" />
    <!-- Run button inside card -->
    <rect x="180" y="74" width="65" height="22" rx="5" fill="#0284c7" opacity="0.85" />
    <text x="212" y="89" fill="#ffffff" class="sub-text" font-weight="600" font-size="10.5" text-anchor="middle">▶ RUN</text>
  </g>

  <!-- Floating Interactive Component Card: Right Preview -->
  <g class="float-2" transform="translate(880, 70)">
    <rect width="260" height="116" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" filter="url(#cardGlow)" />
    <!-- API Request header -->
    <rect x="16" y="14" width="46" height="18" rx="4" fill="#10b981" opacity="0.9" />
    <text x="39" y="27" fill="#ffffff" class="code-font" font-weight="700" font-size="10.5" text-anchor="middle">POST</text>
    <text x="70" y="27" fill="#cbd5e1" class="code-font" font-size="11">/v1/sandbox/run</text>
    <!-- Response Badge -->
    <rect x="195" y="14" width="50" height="18" rx="4" fill="#334155" />
    <text x="220" y="27" fill="#38bdf8" class="code-font" font-weight="600" font-size="10" text-anchor="middle">200 OK</text>
    <!-- Json payload representation -->
    <text x="20" y="55" fill="#64748b" class="code-font" font-size="10.5">{</text>
    <text x="32" y="72" fill="#38bdf8" class="code-font" font-size="10.5">"status": <tspan fill="#34d399">"live_executed"</tspan>,</text>
    <text x="32" y="89" fill="#38bdf8" class="code-font" font-size="10.5">"latency_ms": <tspan fill="#f59e0b">24</tspan></text>
    <text x="20" y="104" fill="#64748b" class="code-font" font-size="10.5">}</text>
  </g>

  <!-- High-Z Main Brand Foreground Headers (Clear, Readable, Centered) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 72)">
      <rect x="-145" y="-15" width="290" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
      <circle cx="-120" cy="0" r="4.5" fill="#34d399" />
      <text x="10" y="4.5" fill="#e2e8f0" class="sub-text" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
        DEVELOPER EXPERIENCE &amp; TOOLING
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="142" text-anchor="middle" class="title-text" font-size="44" fill="url(#primaryGrad)">
      Embeddable Developer Tool &amp; Onboarding
    </text>

    <!-- Subtitle / Mission Tagline -->
    <text x="600" y="180" text-anchor="middle" class="sub-text" font-size="17" fill="#cbd5e1" font-weight="400">
      Interactive API Playgrounds • Live In-Docs Sandboxes • Frictionless Client Run-Buttons
    </text>

    <!-- Category Highlights Pills (Centered) -->
    <g transform="translate(600, 226)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="0.9" />
        <text x="0" y="4" fill="#93c5fd" class="sub-text" font-size="11.5" font-weight="500" text-anchor="middle">⚡ API Playgrounds</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-75, 0)">
        <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="0.9" />
        <text x="0" y="4" fill="#c4b5fd" class="sub-text" font-size="11.5" font-weight="500" text-anchor="middle">🚀 Code Sandboxes</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(85, 0)">
        <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="0.9" />
        <text x="0" y="4" fill="#6ee7b7" class="sub-text" font-size="11.5" font-weight="500" text-anchor="middle">📦 WebContainers</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(235, 0)">
        <rect x="-60" y="-13" width="120" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="0.9" />
        <text x="0" y="4" fill="#fde047" class="sub-text" font-size="11.5" font-weight="500" text-anchor="middle">📖 OpenAPI / Docs</text>
      </g>
    </g>

    <!-- Bottom Stat Badges Highlight Bar -->
    <g transform="translate(600, 280)">
      <text x="0" y="0" text-anchor="middle" class="code-font" font-size="12" fill="#64748b">
        Curated SaaS Platforms &amp; Open-Source Projects • Updated for 2026
      </text>
    </g>
  </g>
</svg>
